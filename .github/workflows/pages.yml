name: Deploy browser page to GitHub Pages

# Builds the self-contained browser page and publishes it as the Pages site
# root (index.html). Runs on every push to main — the page version comes from
# package.json — and can be triggered manually.
#
# Pages may be disabled for the repository (organization policy). In that case
# the preflight check skips deployment with a notice instead of failing; the
# page remains available as a Release asset (kicad-to-eprj3.html).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.check.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build standalone page
        run: node build/bundle.js

      - name: Check GitHub Pages availability
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # 404 when Pages is disabled for the repository (organization policy).
          BUILD_TYPE=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || true)
          if [ -z "$BUILD_TYPE" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=GitHub Pages is disabled::Pages is disabled for this repository (organization policy). Deployment skipped; users can still download kicad-to-eprj3.html from the latest GitHub Release."
          elif [ "$BUILD_TYPE" != "workflow" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Pages source is not GitHub Actions::Set Settings → Pages → Build and deployment → Source to 'GitHub Actions'. Deployment skipped (current source: ${BUILD_TYPE})."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare site
        if: steps.check.outputs.enabled == 'true'
        shell: bash
        run: |
          mkdir -p _site
          cp dist/kicad-to-eprj3.html _site/index.html
          # Direct link to the standalone bundle, for users who want to embed it.
          cp dist/kicad-to-eprj3-*.js _site/ 2>/dev/null || true
          ls -la _site

      - name: Configure Pages
        if: steps.check.outputs.enabled == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
