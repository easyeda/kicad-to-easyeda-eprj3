name: Build release artifact

# Manual only: Actions → “Build release artifact” → Run workflow.
# Bumps the version (default: patch = last digit), runs tests, builds the
# standalone JS + browser page + zip, pushes the version commit, tags it and
# attaches the zip to the GitHub release.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump (patch = last digit)'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bump version
        id: version
        shell: bash
        run: |
          if [ "${{ inputs.bump }}" != "none" ]; then
            node build/version.js "${{ inputs.bump }}"
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building v$VERSION"

      - name: Test
        run: npm test

      - name: Build standalone artifacts
        run: node build/bundle.js

      - name: Commit version bump
        if: inputs.bump != 'none'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if [ -f package-lock.json ]; then git add package-lock.json; fi
          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "chore: bump version to v${{ steps.version.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Create tag
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists"
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          ZIP="dist/kicad-to-eprj3-${{ steps.version.outputs.version }}.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" \
              --title "kicad-to-eprj3 v${{ steps.version.outputs.version }}" \
              --notes "Standalone build (no Node.js needed): open kicad-to-eprj3.html in a browser, or use the bundled JS with Node.js. See README.md inside the zip."
          fi

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kicad-to-eprj3-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
